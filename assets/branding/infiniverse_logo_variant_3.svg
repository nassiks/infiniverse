<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">INFINIVERSE — бесконечность, вариант 3</title>
  <desc id="desc">Фиолетовая сияющая лента бесконечности вокруг надписи INFINIVERSE, с двумя звёздами.</desc>
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6331d9"/>
      <stop offset=".19" stop-color="#a971ff"/>
      <stop offset=".41" stop-color="#e8d0ff"/>
      <stop offset=".57" stop-color="#8243f2"/>
      <stop offset=".82" stop-color="#d7a7ff"/>
      <stop offset="1" stop-color="#6941d6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ae69ff" stop-opacity=".1"/>
      <stop offset=".27" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".56" stop-color="#aa69ff" stop-opacity=".15"/>
      <stop offset=".78" stop-color="#f7e6ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#874bf0" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaff"/>
      <stop offset=".60" stop-color="#f6eaff"/>
      <stop offset="1" stop-color="#b88be7"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="star-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <path id="infinity" d="M 802 250 C 631 78 484 71 336 131 C 177 196 162 389 320 419 C 511 461 659 346 802 250 C 963 142 1088 61 1251 120 C 1429 186 1422 371 1268 408 C 1102 450 950 354 802 250 Z"/>
  </defs>
  <use xlink:href="#infinity" fill="none" stroke="#7930fa" stroke-width="24" opacity=".56" filter="url(#soft-glow)"/>
  <use xlink:href="#infinity" fill="none" stroke="url(#ribbon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  <use xlink:href="#infinity" fill="none" stroke="url(#shine)" stroke-width="4" stroke-linecap="round" opacity=".95"/>
  <path d="M 735 294 Q 769 272 802 250 Q 855 218 916 182" fill="none" stroke="#f0d4ff" stroke-width="6" opacity=".86" stroke-linecap="round"/>
  <g transform="translate(317 411)">
    <circle r="21" fill="#ac58ff" opacity=".75" filter="url(#star-glow)"/>
    <path d="M0-38 C4-6 6-4 38 0 C6 4 4 6 0 38 C-4 6-6 4-38 0 C-6-4-4-6 0-38Z" fill="#fcf1ff"/>
    <circle r="5" fill="#ffffff"/>
  </g>
  <g transform="translate(1260 127)">
    <circle r="21" fill="#ac58ff" opacity=".8" filter="url(#star-glow)"/>
    <path d="M0-38 C4-6 6-4 38 0 C6 4 4 6 0 38 C-4 6-6 4-38 0 C-6-4-4-6 0-38Z" fill="#fcf1ff"/>
    <circle r="5" fill="#ffffff"/>
  </g>
  <text x="800" y="309" text-anchor="middle" font-family="Montserrat, 'Century Gothic', 'Segoe UI', Arial, sans-serif" font-size="83" font-weight="400" letter-spacing="17" fill="url(#word)" stroke="#170b2a" stroke-width="5" paint-order="stroke fill">INFINIVERSE</text>
</svg>
