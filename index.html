<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
    <title>
        YOUR UNIVERSE — Hybrid Galaxy
    </title>
    <link href="styles/main.css" rel="stylesheet"/>
</head>
<body>
<main id="app">
    <div id="star-background" aria-hidden="true"></div>
    <div class="art-area" id="art-area">
        <div class="nebula-haze">
        </div>
        <div class="float-galaxy a">
        </div>
        <div class="float-galaxy b">
        </div>
        <div class="galaxy-frame">
            <img alt="Спиральная галактика GENESIS-01" id="galaxy-art" src="assets/galaxy/galaxy_core.png"/>
        </div>
        <div class="glow-core">
        </div>
        <div class="nebula-front">
        </div>
        <div class="edge-horizon">
        </div>
    </div>
    <canvas id="webgl">
    </canvas>
    <div class="flash" id="flash">
    </div>
    <div class="hud">
        <div class="toprow">
            <button aria-label="Меню" class="icon" id="menu">
                <svg viewbox="0 0 32 32">
                    <path d="M4 8h24M4 16h24M4 24h24">
                    </path>
                </svg>
            </button>
            <div class="brand">
                YOUR UNIVERSE
            </div>
            <button aria-label="Поиск планеты" class="icon" id="searchBtn">
                <svg viewbox="0 0 32 32">
                    <circle cx="14" cy="14" r="10">
                    </circle>
                    <path d="m22 22 7 7">
                    </path>
                </svg>
            </button>
        </div>
        <div class="subtitle" id="subtitle">
            Стадия 3 — Появилась галактика
        </div>
        <div class="counts">
            <div class="pill">
                <svg viewbox="0 0 32 32">
                    <circle cx="15" cy="15" r="7">
                    </circle>
                    <ellipse cx="15" cy="15" rx="15" ry="5" transform="rotate(-23 15 15)">
                    </ellipse>
                </svg>
                <span>
       <strong>
        100
       </strong>
       планет
      </span>
            </div>
            <div class="pill">
                <svg viewbox="0 0 32 32">
                    <path d="M16 16c-5-4 0-10 5-7 11 9-2 23-14 16-13-8-5-24 7-24 17 0 20 23 8 29">
                    </path>
                </svg>
                <span>
       <strong>
        1
       </strong>
       галактика
      </span>
            </div>
        </div>
    </div>
    <button class="actionBack" id="back">
        ← Обзор галактики
    </button>
    <div class="chip" id="modeTitle">
        GENESIS-01 · 100 уникальных планет
    </div>
    <div class="zoom">
        <button aria-label="Приблизить" id="plus">
            +
        </button>
        <button aria-label="Отдалить" id="minus">
            −
        </button>
    </div>
    <div class="hint">
        Нажми + или найди планету по нику
    </div>
    <div class="footer">
        <svg viewbox="0 0 88 70">
            <circle cx="37" cy="35" r="20">
            </circle>
            <ellipse cx="37" cy="35" rx="38" ry="13" transform="rotate(-25 37 35)">
            </ellipse>
            <path d="M71 48v20M61 58h20">
            </path>
        </svg>
        <div class="rule">
        </div>
        <div>
            Каждая подписка + комментарий создаёт планету
        </div>
    </div>
    <div class="search" id="search">
        <div class="searchpanel">
            <button class="close" id="closeSearch">
                ×
            </button>
            <h2>
                Найти свою планету
            </h2>
            <input autocomplete="off" id="query" placeholder="@astro_fox1 или @luna_wave1"/>
            <div class="searchresults" id="results">
            </div>
        </div>
    </div>
    <div class="detail" id="detail">
        <button class="x" id="closeDetail">
            ×
        </button>
        <small id="planetId">
            ПЛАНЕТА #001
        </small>
        <h2 id="planetName">
        </h2>
        <small id="planetUser">
        </small>
        <p id="planetDescription">
        </p>
        <div id="planetStatus" style="color:#cca6e6;font-size:13px">
        </div>
        <button id="statusBtn">
            Изменить статус
        </button>
        <button id="goBack">
            Назад
        </button>
    </div>
    <div class="error" id="error">
    </div>
</main>
<script src="data/planets.js">
</script>
<script src="scripts/scene.js" type="module">
</script>
</body>
</html>
